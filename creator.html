<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css" />
    <!-- PyScript JavaScript -->
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>
    <title> Working with Set Dictionaries </title>
 <title>Get to Know the Creator</title>

    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-image: url(https://i.pinimg.com/736x/9c/8f/5e/9c8f5eda0b418a55c7f8818e2579622e.jpg);
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #c4b5fd;
        }

        p {
            color: #ddd6fe;
        }

        button {
            background-color: #8b5cf6;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #7c3aed;
        }

        #output {
            margin: 25px auto;
            padding: 20px;
            width: 300px;
            background-color: #252047;
            border-radius: 12px;
            color: #ddd6fe;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>♡ Get to Know the Creator ♡</h1>

    <p>Discover a little more about the person behind this project!</p>

    <button py-click="show_creator">Meet the Creator</button>

    <div id="output"></div>

    <py-script src="creator.py"></py-script>

</body>
</html>
